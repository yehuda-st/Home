name: PDF - Maoz Hanukkah quiz
on:
  workflow_dispatch:
  push:
    paths:
      - 'מעוז/קריאה/חידון חנוכה לילדים - שאלות 1-20 - מנוקד.md'
      - 'מעוז/קריאה/build_quiz_pdf.py'
      - '.github/workflows/maoz-quiz-pdf.yml'
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install weasyprint markdown
      - name: Build print-ready PDF
        run: python 'מעוז/קריאה/build_quiz_pdf.py'
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'מעוז/קריאה/חידון חנוכה לילדים - שאלות 1-20 - מנוקד.pdf'
          if ! git diff --cached --quiet; then
            git commit -m "Generate printable vocalized Hanukkah quiz PDF"
            git push
          fi
